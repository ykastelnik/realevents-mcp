name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Audits PRODUCTION dependencies at high+, with a documented allowlist for
      # advisories that are unreachable in a stdio-only server. Auditing the full
      # tree failed on dev tooling that never ships, and a permanently red gate
      # gets ignored. See scripts/audit-check.mjs.
      - name: Audit dependencies
        run: node scripts/audit-check.mjs

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

# MCP Registry publish is currently manual:
#   ./mcp-publisher login github && ./mcp-publisher publish
# Re-automate as a CI job when mcp-publisher supports OIDC authentication
# from GitHub Actions natively. Tracked in the realevents.co tech backlog.
