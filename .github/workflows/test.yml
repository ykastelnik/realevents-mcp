name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Audits PRODUCTION dependencies at high+, with a documented allowlist for
      # advisories that are unreachable in a stdio-only server. Auditing the full
      # tree failed on dev tooling that never ships, and a permanently red gate
      # gets ignored. See scripts/audit-check.mjs.
      - name: Audit dependencies
        run: node scripts/audit-check.mjs

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:coverage
